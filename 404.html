<!DOCTYPE html>
<html lang="en" data-redirect-page="true">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ea" />
  <title>Link not found · go.bynoor.io</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script src="/redirect.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page page--404">
  <main class="shell shell--404">
    <div class="notfound-card">
      <a href="/" class="wordmark wordmark--inline">
        <span class="wordmark__go">go.</span><span class="wordmark__base">bynoor.io</span>
      </a>
      <p class="notfound-slug" id="missing-slug" aria-live="polite"></p>
      <h1 class="notfound-title">That short link isn't on the map.</h1>
      <p class="notfound-copy">
        Every active link lives in the directory on <strong>go.bynoor.io</strong>, or you can jump straight to the full site.
      </p>
      <div class="notfound-actions">
        <a href="/" class="btn btn--pine">
          <span>Open link directory</span>
          <span aria-hidden="true">→</span>
        </a>
        <a href="https://bynoor.io/" class="btn btn--paper">
          <span>Visit bynoor.io</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const slug = document.documentElement.dataset.missingSlug || "";
      const el = document.getElementById("missing-slug");
      if (el) {
        el.textContent = slug ? `go.bynoor.io/${slug}` : "Unknown route";
      }
    })();
  </script>
</body>
</html>
